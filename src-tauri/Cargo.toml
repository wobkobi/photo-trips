[package]
name = "pic-cabinet"
version = "0.0.0" # The app version lives in package.json (tauri.conf.json reads it from there)
description = "Sort photos into year, month and trip folders"
authors = ["Harrison"]
edition = "2024"
license-file = "../LICENSE"
homepage = "https://www.tothepoint.co.nz"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pic_cabinet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
rusqlite = { version = "0.42.0", features = ["bundled"] }
chrono = { version = "0.4.45", features = ["serde"] }
regex = "1.13.1"
walkdir = "2.5.0"
nom-exif = "3.8.0"
thiserror = "2.0.21"
blake3 = "1.8.7"
rayon = "1.12.0"
log = "0.4.35"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Devices_PortableDevices", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Variant", "Win32_Storage_EnhancedStorage", "Win32_Globalization", "Win32_Storage_Packaging_Appx"] }
trash = "5.3.0"
reverse_geocoder = "4.1.1"
notify = "8"
tauri-plugin-log = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3

strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

[dev-dependencies]
tempfile = "3.27.0"
