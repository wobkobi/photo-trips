[package]
name = "pic-cabinet"
version = "0.0.0" # The app version lives in package.json (tauri.conf.json reads it from there)
description = "Sort photos into year, month and trip folders"
authors = ["Harrison"]
edition = "2024"
license-file = "../LICENSE"
homepage = "https://www.tothepoint.co.nz"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pic_cabinet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
rusqlite = { version = "0.42.0", features = ["bundled"] }
chrono = { version = "0.4.45", features = ["serde"] }
regex = "1.13.1"
walkdir = "2.5.0"
nom-exif = "3.8.0"
thiserror = "2.0.21"
blake3 = "1.8.7"
rayon = "1.12.0"
log = "0.4.35"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Devices_PortableDevices", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Variant", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_Storage_EnhancedStorage", "Win32_Globalization", "Win32_Storage_Packaging_Appx", "Foundation", "Devices_Geolocation"] }
trash = "5.3.0"
reverse_geocoder = "4.1.1"
notify = "8"
tauri-plugin-log = "2"


# Dev builds optimise the libraries and lightly optimise the app itself: unoptimised, the image
# work behind each viewer preview (flattening and JPEG encoding) takes about a second, where a
# release build takes milliseconds. Libraries rarely rebuild, so this costs one slow first build.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Thin LTO with the default codegen units halves a release build (297 s > 145 s for the app crate
# with cached dependencies) for an .exe about 10% bigger. Fat LTO with one codegen unit
# re-optimises every dependency in one single-threaded pass on every build, which the CI cache
# can't help with. See https://tauri.app/concept/size/#cargo-configuration
[profile.release]
lto = "thin"
opt-level = 3

strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"

# The WebView2 COM types Tauri's own webview handle hands out, for settings Tauri doesn't expose.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"

[dev-dependencies]
tempfile = "3.27.0"
